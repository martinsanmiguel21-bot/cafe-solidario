<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café Solidario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EE; --surface:#FFFFFF; --sunk:#E5ECE7; --ink:#10201A; --ink2:#55665C; --ink3:#8B9A91;
  --line:rgba(16,32,26,.09); --green:#0B4D30; --green2:#167A4B; --gsoft:#DCEEE2; --gink:#0B4D30;
  --y:#FFCD1C; --ysoft:#FFF3C4; --yink:#5A4600; --coffee:#6B4226; --crema:#F4E3CF; --cink:#6B4226;
  --vd:#0B4D30; --vdsoft:#DCEEE2; --vdink:#0B4D30; --vm:#24407E; --vmsoft:#E0E7F6; --vmink:#24407E;
  --red:#C8283F; --redsoft:#FBE3E7;
  --shadow:0 1px 2px rgba(16,32,26,.05),0 8px 24px -14px rgba(16,32,26,.2);
  --lift:0 18px 44px -14px rgba(16,32,26,.35);
  --out:cubic-bezier(.16,1,.3,1);
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08130D; --surface:#11211A; --sunk:#182B22; --ink:#E7F2EA; --ink2:#A2B7AB; --ink3:#6E8477;
  --line:rgba(255,255,255,.08); --gsoft:#183A28; --gink:#8FDAB0; --ysoft:#332B0C; --yink:#FFE07A; --crema:#2E2218; --cink:#E8C9A6;
  --vdsoft:#183A28; --vdink:#8FDAB0; --vmsoft:#1C2843; --vmink:#AEC1F2; --redsoft:#3A141B; --red:#FF7A8E;
  --shadow:0 0 0 1px rgba(255,255,255,.05); --lift:0 18px 44px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130D; --surface:#11211A; --sunk:#182B22; --ink:#E7F2EA; --ink2:#A2B7AB; --ink3:#6E8477;
  --line:rgba(255,255,255,.08); --gsoft:#183A28; --gink:#8FDAB0; --ysoft:#332B0C; --yink:#FFE07A; --crema:#2E2218; --cink:#E8C9A6;
  --vdsoft:#183A28; --vdink:#8FDAB0; --vmsoft:#1C2843; --vmink:#AEC1F2; --redsoft:#3A141B; --red:#FF7A8E;
  --shadow:0 0 0 1px rgba(255,255,255,.05); --lift:0 18px 44px -10px rgba(0,0,0,.7); color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.03em}
h1{font-size:clamp(30px,8vw,40px);line-height:1}
h2{font-size:21px;line-height:1.15}
h3{font-size:17px;letter-spacing:-.015em}
p{margin:0}

/* barra del prototipo */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:var(--bg);padding:7px 12px;display:flex;align-items:center;gap:10px;font-size:13px}
.demo .lbl{opacity:.65;white-space:nowrap}
.demo .seg{flex:1;max-width:440px;margin:0;background:rgba(127,127,127,.22);padding:3px}
.demo .seg button{color:inherit;opacity:.75;height:30px;font-size:13px}
.demo .seg button.on{color:var(--ink);opacity:1}
.demo .seg i{background:var(--bg);top:3px;bottom:3px;left:3px}
.demo .reset{opacity:.7;font-size:12.5px;text-decoration:underline;white-space:nowrap}
@media (max-width:480px){.demo .lbl{display:none}}

/* estructura */
.shell{max-width:560px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom,0px))}
.shell.wide{max-width:980px}
.top{display:flex;align-items:center;gap:12px;padding:16px 0 18px}
.mark{width:42px;height:42px;border-radius:13px;background:var(--coffee);color:#F4E3CF;display:grid;place-items:center;flex:none}
.top .t{flex:1;min-width:0}
.top b{display:block;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.1}
.top small{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.view{animation:vin .35s var(--out) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 2px 12px}
.sec small,.sec .lk{color:var(--ink2);font-size:14px}
.lk{color:var(--gink)!important;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* componentes */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.pad16{padding:16px}.pad20{padding:20px}
.stack{display:grid;gap:10px}
.btn{height:48px;border-radius:14px;padding:0 18px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--out),opacity .2s,background .25s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green);color:#fff}
.btn.yel{background:var(--y);color:#2B2200}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.line{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.danger{background:var(--redsoft);color:var(--red)}
.btn.block{width:100%}
.btn.sm{height:38px;border-radius:11px;padding:0 13px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.vd{background:var(--vdsoft);color:var(--vdink)}
.tag.vm{background:var(--vmsoft);color:var(--vmink)}
.tag.ok{background:var(--gsoft);color:var(--gink)}
.tag.warn{background:var(--ysoft);color:var(--yink)}
.tag.no{background:var(--redsoft);color:var(--red)}
.tag.cof{background:var(--crema);color:var(--cink)}
.meta{color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:13px;background:var(--sunk);margin-bottom:14px}
.seg button{position:relative;z-index:1;height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);text-align:center;transition:color .25s;white-space:nowrap;padding:0 8px}
.seg button.on{color:var(--ink)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .4s var(--out),width .3s var(--out)}
.field{display:block}
.field + .field{margin-top:12px}
.field>span{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin:0 2px 6px}
.field input,.field select,.field textarea{width:100%;height:50px;border-radius:14px;border:0;background:var(--sunk);padding:0 14px;font-size:16px;outline:0;-webkit-appearance:none;appearance:none}
.field textarea{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:0 0 0 2px var(--green2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .field + .field{margin-top:0}
.hint{font-size:13.5px;color:var(--ink2);margin-top:8px}
.err{color:var(--red);font-size:13.5px;font-weight:600;min-height:20px;margin-top:8px}
.otp{width:100%;height:64px;border-radius:16px;border:0;background:var(--sunk);text-align:center;font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.45em;padding-left:.45em;outline:0}
.otp:focus{box-shadow:0 0 0 2px var(--green2)}
.rows{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.r{display:flex;gap:12px;align-items:center;padding:13px 14px;width:100%;text-align:left}
.r + .r{border-top:1px solid var(--line)}
.ri{width:38px;height:38px;border-radius:12px;background:var(--gsoft);color:var(--gink);display:grid;place-items:center;flex:none}
.ri.cof{background:var(--crema);color:var(--cink)}
.ri.y{background:var(--ysoft);color:var(--yink)}
.ri.red{background:var(--redsoft);color:var(--red)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:15px;font-weight:600}
.rt small{display:block;color:var(--ink2);font-size:13px}
.chev{color:var(--ink3)}
.empty{text-align:center;color:var(--ink2);padding:28px 16px;font-size:15px}
.empty .ic{width:30px;height:30px;margin:0 auto 8px;display:block;color:var(--ink3)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--sunk);font-weight:700;font-size:18px;text-align:center}
.stepper b{min-width:26px;text-align:center;font-family:var(--display);font-size:18px}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .25s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--out)}
.toggle.on{background:var(--green2)}.toggle.on::after{transform:translateX(20px)}

/* barra inferior (alumno) */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;width:min(calc(100% - 28px),420px);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:24px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 14px 34px -12px rgba(16,32,26,.35)}
.tabbar button{height:52px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink3);transition:background .25s,color .25s}
.tabbar button.on{background:var(--gsoft);color:var(--gink)}

/* login */
.auth-hero{position:relative;overflow:hidden;background:var(--green);color:#fff;border-radius:26px;padding:24px 22px;margin-bottom:12px}
.auth-hero p{color:rgba(255,255,255,.8);margin-top:10px;max-width:32ch}
.auth-hero .cup{position:absolute;right:-16px;bottom:-22px;width:150px;height:150px;color:rgba(255,255,255,.1)}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--sunk);transition:background .3s}
.steps i.on{background:var(--green2)}
.secure{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--gsoft);color:var(--gink);font-size:13.5px;margin-top:14px}

/* notificación simulada */
.notif{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:96;width:min(calc(100% - 24px),400px);transform:translate(-50%,-140%);opacity:0;transition:transform .5s var(--out),opacity .3s;
  display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--lift)}
.notif.on{transform:translate(-50%,0);opacity:1}
.notif .ni{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.notif b{display:block;font-size:13.5px}
.notif p{font-size:14px}
.notif .code{font-family:var(--display);font-weight:800;letter-spacing:.12em}
.notif small{display:block;font-size:11.5px;color:var(--ink3)}

/* alumno */
.next{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:var(--coffee);color:#F4E3CF}
.next .k{font-size:13.5px;font-weight:600;opacity:.8}
.next h2{color:#fff;font-size:28px;margin-top:4px}
.next .m{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px;opacity:.9}
.next .m span{display:inline-flex;align-items:center;gap:6px}
.next .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.next .btn.soft{background:rgba(255,255,255,.14);color:#fff}
.next .cup{position:absolute;right:-20px;top:-14px;width:130px;height:130px;color:rgba(255,255,255,.08)}
.banner{display:flex;gap:14px;align-items:flex-start;padding:16px}
.banner .ri{width:44px;height:44px;border-radius:14px}
.banner h3{font-size:16px}
.banner p{color:var(--ink2);font-size:14px;margin-top:3px}
.banner .btns{margin-top:12px}
.stamp{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:10px;border:2px solid var(--green2);color:var(--green2);font-family:var(--display);font-weight:800;font-size:14px;transform:rotate(-2deg);animation:stampIn .55s var(--out) both}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp{border-color:var(--gink);color:var(--gink)}}
@keyframes stampIn{from{opacity:0;transform:rotate(-12deg) scale(1.6)}}
.date{display:flex;gap:14px;align-items:center;padding:13px 14px;width:100%;text-align:left;transition:transform .2s var(--out)}
.date:active{transform:scale(.985)}
.dt{width:56px;height:62px;border-radius:15px;display:grid;place-content:center;text-align:center;background:var(--crema);color:var(--cink);flex:none}
.dt b{font-family:var(--display);font-size:25px;line-height:1}
.dt small{font-size:12px;font-weight:700}
.date.off .dt{background:var(--sunk);color:var(--ink3)}
.date .dx{flex:1;min-width:0}
.date .dx b{display:block;font-size:15.5px;font-weight:600}
.bar{display:flex;gap:3px;margin-top:8px;max-width:220px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--sunk)}
.bar i.vd{background:var(--vd)}.bar i.vm{background:var(--vm)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar i.vd{background:#3FB07A}:root:not([data-theme="light"]) .bar i.vm{background:#6E8DD6}}
.month{font-size:13.5px;font-weight:700;color:var(--ink2);margin:22px 4px 10px}
.month:first-child{margin-top:0}
.aviso{background:var(--ysoft);border-radius:16px;padding:12px 14px}
.aviso + .aviso{margin-top:8px}
.aviso b{display:block;font-size:13px;color:var(--yink)}
.aviso p{font-size:15px;margin-top:2px}
.aviso.cancel{background:var(--redsoft)}
.aviso.cancel b{color:var(--red)}
.big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px 12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.stat small{display:block;color:var(--ink2);font-size:12.5px;margin-top:4px}

/* taza de confirmación */
.ov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,15,10,.45);animation:fi .25s both;padding:20px}
.ov.bye{animation:fo .3s ease-in forwards}
@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0}}
.ov .box{background:var(--surface);border-radius:28px;padding:24px 24px 20px;text-align:center;box-shadow:var(--lift);width:min(100%,320px);animation:pop .5s var(--out) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.95)}}
.ov h2{margin:12px 0 4px}
.ov p{color:var(--ink2)}
.mug{width:110px;height:110px;margin:0 auto}
.mug .liq{transform:translateY(60px);animation:pour 1.2s .15s var(--out) forwards}
@keyframes pour{to{transform:translateY(0)}}
.mug .stm path{opacity:0;animation:stm 2.4s 1.1s ease-in-out infinite}
@keyframes stm{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* hojas */
.bd{position:fixed;inset:0;z-index:60;background:rgba(5,15,10,.42);opacity:0;transition:opacity .35s}
.bd.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--lift);transform:translateY(100%);transition:transform .45s var(--out)}
.sheet.on{transform:none}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 8px}
.sheet .x{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:none}
.sheet .bdy{overflow-y:auto;padding:4px 18px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
@media (min-width:700px){.sheet{bottom:50%;border-radius:26px;transform:translateY(60%);opacity:0;transition:transform .45s var(--out),opacity .3s;max-height:86vh}.sheet.on{transform:translateY(50%);opacity:1}}

/* apoderado */
.doc{padding:22px 20px}
.terms{background:var(--sunk);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.55;margin:16px 0;max-height:240px;overflow:auto}
.terms p + p{margin-top:8px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;cursor:pointer;margin-top:14px}
.check input{width:22px;height:22px;accent-color:var(--green);margin:0;flex:none}
.sig{position:relative;margin-top:14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);height:170px;touch-action:none}
.sig canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:16px}
.sig .ln{position:absolute;left:16px;right:16px;bottom:36px;border-bottom:1.5px dashed #C9D3CD;pointer-events:none}
.sig .ph{position:absolute;left:16px;bottom:12px;font-size:12.5px;color:#8B9A91;pointer-events:none}
.sig .clr{position:absolute;right:10px;top:10px;font-size:13px;font-weight:600;color:#55665C;background:#EEF3EE;padding:5px 10px;border-radius:9px}
.sigimg{display:block;max-width:240px;max-height:90px;background:#fff;border-radius:12px;padding:6px 10px;margin-top:10px}

/* coordinación */
.ctabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 18px;padding:2px 18px}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{flex:none;height:40px;padding:0 15px;border-radius:20px;font-weight:600;font-size:14.5px;color:var(--ink2);background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.ctabs button.on{background:var(--ink);color:var(--bg)}
.ctabs .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--y);color:#2B2200;font-size:12px;font-weight:700;display:grid;place-items:center}
.cgrid{display:grid;gap:14px}
@media (min-width:860px){.cgrid.two{grid-template-columns:1.25fr 1fr;align-items:start}}
.person{display:flex;gap:12px;align-items:center;padding:12px 14px}
.person + .person{border-top:1px solid var(--line)}
.av.vd{background:var(--vdsoft);color:var(--vdink)}.av.vm{background:var(--vmsoft);color:var(--vmink)}
.person .pt{flex:1;min-width:0}
.person .pt b{display:block;font-size:15px;font-weight:600}
.person .pt small{color:var(--ink2);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.att{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--sunk);color:var(--ink3);transition:background .25s,color .25s;flex:none}
.att.on{background:var(--green);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:17px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:13.5px;color:var(--ink2);transition:background .2s,color .2s}
.chip.on{background:var(--ink);color:var(--bg)}
.feed .r{padding:11px 14px}
.feed .r small{font-size:12.5px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600;font-size:14.5px;margin-bottom:10px}
.dhead{display:flex;gap:16px;align-items:center}
.dhead .dt{width:68px;height:74px}
.dhead .dt b{font-size:30px}
.dhead .meta{flex-wrap:nowrap;align-items:flex-start}
.dhead .meta .ic{margin-top:2px}
.compose{display:flex;gap:8px}
.compose input{flex:1;min-width:0;height:46px;border-radius:13px;border:0;background:var(--sunk);padding:0 13px;font-size:15.5px;outline:0}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px;color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:95;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:14.5px;padding:11px 16px;border-radius:15px;box-shadow:var(--lift);transition:transform .45s var(--out),opacity .3s;max-width:calc(100% - 32px);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.foot{margin-top:28px;text-align:center;color:var(--ink3);font-size:13px}

/* v3: pase, portería, solicitudes */
.pass{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.pass-top{position:relative;padding:20px;background:var(--coffee);color:#F4E3CF}
.pass-top .k{font-size:13.5px;font-weight:600;opacity:.8}
.pass-top h2{color:#fff;font-size:26px;margin-top:4px}
.pass-top .m{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px;opacity:.9}
.pass-top .m span{display:inline-flex;align-items:center;gap:6px}
.pass-cut{position:relative;height:0;border-top:2px dashed var(--line)}
.pass-cut::before,.pass-cut::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.pass-cut::before{left:-11px}.pass-cut::after{right:-11px}
.pass-bot{display:flex;gap:16px;align-items:center;padding:18px 20px}
.qr{width:128px;height:128px;flex:none;padding:8px;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.qr svg{width:100%;height:100%;display:block}
.track{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;font-size:14px;font-weight:600;color:var(--ink3)}
.track li{display:flex;align-items:center;gap:8px}
.track i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.track li.on{color:var(--ink)}
.track li.on i{background:var(--green2);border-color:var(--green2)}
.dtabs{display:flex;gap:4px;margin:16px 0 14px;border-bottom:1px solid var(--line)}
.dtabs button{height:42px;padding:0 12px;font-weight:600;font-size:14.5px;color:var(--ink2);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.dtabs button.on{color:var(--ink);border-color:var(--ink)}
.dtabs .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--y);color:#2B2200;font-size:12px;font-weight:700;display:grid;place-items:center}
.person.sug{background:color-mix(in srgb,var(--crema) 55%,transparent)}
.scanbox{position:relative;border-radius:20px;overflow:hidden;background:var(--ink);color:var(--bg);min-height:200px;display:grid;place-items:center;transition:box-shadow .3s}
.scanbox video{display:none;width:100%;max-height:340px;object-fit:cover}
.scanbox.live video{display:block}
.scanbox.live .scanidle{display:none}
.scanbox.live::after{content:"";position:absolute;inset:18% 22%;border:3px solid var(--y);border-radius:18px;pointer-events:none}
.scanbox.ok{animation:okf .6s}
.scanbox.bad{animation:badf .6s}
@keyframes okf{0%{box-shadow:0 0 0 0 rgba(22,122,75,.9)}100%{box-shadow:0 0 0 14px rgba(22,122,75,0)}}
@keyframes badf{0%{box-shadow:0 0 0 0 rgba(200,40,63,.9)}100%{box-shadow:0 0 0 14px rgba(200,40,63,0)}}
.scanidle{text-align:center;padding:26px 18px}
.scanidle .ic{width:40px;height:40px;margin:0 auto 10px;display:block;opacity:.7}
.scanidle p{opacity:.8;margin-bottom:14px}
.scanidle .btn.soft{background:rgba(127,127,127,.25);color:inherit}
details.how summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.how summary::after{content:"+";font-size:22px;color:var(--ink3)}
details.how[open] summary::after{content:"−"}
details.how p{margin-top:10px;line-height:1.55}
@media (max-width:420px){.pass-bot{flex-direction:column;align-items:flex-start}.qr{width:160px;height:160px;align-self:center}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* real */
.land{display:grid;gap:10px;margin-top:14px}
.land .r{background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.load{display:grid;place-items:center;min-height:60vh;color:var(--ink2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--sunk);border-top-color:var(--green2);animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.refresh{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:24}

function rutOk(r){
  const c = String(r).replace(/[^0-9kK]/g,'').toUpperCase(); if (c.length < 8) return false;
  const body = c.slice(0,-1), dv = c.slice(-1); let s = 0, m = 2;

      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return err('Escribe un correo válido');
      if (L.modo === 'alumno' && !L.inv) {
        try { const doms = await q(sb.from('dominios').select('dominio')); if (!doms.some(d => d.dominio === e.split('@')[1])) return err('Usa el correo de tu colegio, o toca "Tengo un código de invitación"'); } catch (x) {}
      }
      L.ocupado = true; render();
      const { error } = await sb.auth.signInWithOtp({ email:e, options:{ shouldCreateUser:true } });
      L.ocupado = false;
      if (error) { render(); return err(msgError(error)); }
      L.paso = 'codigo'; L.reenvio = Date.now() + 60e3; render();
    };
    $('#lgo').onclick = go; $('#lmail').onkeydown = ev => { if (ev.key === 'Enter') go(); };
  }
  if ($('#lok')) {
    const ok = async () => {
      const t = $('#lotp').value.replace(/\D/g, ''); if (t.length !== 6) return err('El código tiene 6 dígitos');
      L.ocupado = true; $('#lok').disabled = true;
      const { error } = await sb.auth.verifyOtp({ email:L.email, token:t, type:'email' });
      L.ocupado = false;
      if (error) { $('#lok').disabled = false; return err(msgError(error)); }
      sessionStorage.setItem('cs-login', String(Date.now()));
      await cargarRol();
    };
    $('#lok').onclick = ok; $('#lotp').oninput = ev => { if (ev.target.value.replace(/\D/g,'').length === 6) ok(); }; $('#lotp').focus();
    $('#lback').onclick = () => { L.paso = 'correo'; render(); };
    $('#lre').onclick = async () => {
      if (Date.now() < (L.reenvio || 0)) return err(`Espera ${Math.ceil((L.reenvio - Date.now()) / 1000)} s para pedir otro`);
      const { error } = await sb.auth.signInWithOtp({ email:L.email, options:{ shouldCreateUser:true } });
      if (error) return err(msgError(error)); L.reenvio = Date.now() + 60e3; err(''); toast('Te mandamos un código nuevo');
    };
  }
}

async function cargarRol(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { L.paso = 'inicio'; return render(); }
  ST.email = session.user.email.toLowerCase();
  $('#app').innerHTML = `<div class="load"><div><div class="spin"></div>Cargando…</div></div>`;
  try {
    if (L.modo === 'coord') {
      if (!(await rpc('es_coordinador'))) { await sb.auth.signOut(); L.paso = 'correo'; render(); return toast('Este correo no tiene acceso a coordinación'); }
      ST.rol = 'coord'; await cargarCoord();
    } else if (L.modo === 'apoderado') {
      ST.rol = 'apoderado'; ST.apo = await rpc('apoderado_mis_alumnos');
    } else {
      const al = await q(sb.from('alumnos').select('*').eq('id', session.user.id).maybeSingle());
      ST.rol = 'alumno';
      if (!al) { ST.alumno = null; L.paso = 'perfil'; }
      else { ST.alumno = al; await cargarAlumno(); }
    }
  } catch (e) { toast(msgError(e)); }
  render();
}

async function cargarAlumno(){
  const uid = ST.alumno.id;
  const [fechas, mis, aut, cupos, avisos, aj] = await Promise.all([
    q(sb.from('fechas').select('*').order('dia')),
    q(sb.from('solicitudes').select('*').eq('alumno_id', uid)),
    q(sb.from('autorizaciones').select('estado,apoderado_nombre,firmada_en,firmada_por,vence').eq('alumno_id', uid).maybeSingle()),
    rpc('cupos'),
    q(sb.from('avisos').select('*').order('creado', { ascending:false })),
    q(sb.from('ajustes').select('*').eq('id', 1).maybeSingle()),
  ]);
  ST.fechas = fechas; ST.mis = mis; ST.aut = aut; ST.avisos = avisos; ST.ajustes = aj || {};
  ST.cupos = {}; cupos.forEach(c => { (ST.cupos[c.fecha_id] = ST.cupos[c.fecha_id] || {})[c.colegio] = c; });
}
const esPasada = f => fromIso(f.dia) < hoy();
const futurasA = () => ST.fechas.filter(f => !esPasada(f));
const miSol = id => ST.mis.find(s => s.fecha_id === id) || null;
const vigenteA = () => ST.aut && ST.aut.estado === 'vigente' && fromIso(ST.aut.vence) >= hoy();
function histDe(sols, fechas, aj){
  const faltasPara = (aj && aj.faltas_para_bajar) || 2, dias = (aj && aj.dias_prioridad_baja) || 30;
  let veces = 0; const faltas = [];
  fechas.filter(f => esPasada(f) && f.estado !== 'cancelada').sort((a, b) => b.dia.localeCompare(a.dia)).forEach(f => {
    const s = sols.find(x => x.fecha_id === f.id); if (!s || s.estado !== 'aceptado') return;
    if (s.salida) veces++; else if (!s.perdonada) faltas.push(f);
  });
  const lim = Date.now() - 60 * 864e5, recientes = faltas.filter(f => fromIso(f.dia).getTime() > lim);
  let baja = null; if (recientes.length >= faltasPara) { const d = fromIso(recientes[0].dia); d.setDate(d.getDate() + dias); if (d > hoy()) baja = d; }
  return { veces, faltas, recientes, baja };
}

function hojaFirma(id){
  const a = ST.apo.find(x => x.alumno_id === id); if (!a) return;
  openSheet('Autorización para ' + a.nombre.split(' ')[0], `
    <div class="terms" tabindex="0" style="margin-top:0">${(CONFIG.autorizacion[a.colegio] || []).map(p => `<p>${esc(p)}</p>`).join('')}</div>
    <label class="field"><span>Tu RUT (se compara con el registro del colegio)</span><input id="ar" placeholder="12.345.678-9"></label>
    <label class="check"><input type="checkbox" id="ac"><span>Leí las condiciones y autorizo a ${esc(a.nombre)} a participar en Café Solidario.</span></label>
    <div class="sig"><canvas id="cv" aria-label="Recuadro para firmar con el dedo"></canvas><div class="ln"></div><span class="ph">Firma aquí con el dedo</span><button class="clr" id="clr">Borrar</button></div>
    <label class="check"><input type="checkbox" id="aa" checked><span>Quiero recibir avisos de sus salidas.</span></label>
    <div class="err" id="aerr"></div><button class="btn pri block" id="a3">${ic('pen','s')}Firmar autorización</button>`);
  setTimeout(() => {
    const cv = $('#cv'), r = cv.getBoundingClientRect(), dpr = Math.min(3, devicePixelRatio || 1);
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const g = cv.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.6; g.lineCap = 'round'; g.strokeStyle = '#10201A';
    let on = false, last = null; sig = { cv, ink:0 };
    const pt = e => { const b = cv.getBoundingClientRect(); return { x:e.clientX - b.left, y:e.clientY - b.top }; };
    cv.onpointerdown = e => { on = true; last = pt(e); cv.setPointerCapture(e.pointerId); $('.sig .ph').style.opacity = 0; };
    cv.onpointermove = e => { if (!on) return; const p = pt(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); sig.ink += Math.hypot(p.x - last.x, p.y - last.y); last = p; };
    cv.onpointerup = cv.onpointercancel = () => on = false;
    $('#clr').onclick = () => { g.clearRect(0, 0, cv.width, cv.height); sig.ink = 0; $('.sig .ph').style.opacity = 1; };
    $('#ar').onblur = e => { if (e.target.value) e.target.value = fmtRut(e.target.value); };
    $('#a3').onclick = async () => {
      const err = m => $('#aerr').textContent = m, rut = $('#ar').value;
      if (!rutOk(rut)) return err('Revisa el RUT: el dígito verificador no coincide');
      if (!$('#ac').checked) return err('Marca que leíste y autorizas');
      if (sig.ink < 40) return err('Falta tu firma en el recuadro');
      $('#a3').disabled = true;
      try { await rpc('apoderado_firmar', { p_alumno:id, p_rut:fmtRut(rut), p_firma:cv.toDataURL('image/png'), p_avisar:$('#aa').checked });
        ST.apo = await rpc('apoderado_mis_alumnos'); closeSheet(); render(); toast('Autorización firmada. ¡Gracias!'); }
      catch (e) { $('#a3').disabled = false; err(msgError(e)); }
    };
  }, 450);
}

async function cargarCoord(){
  const [fechas, sols, alumnos, auts, registro, codigos, actividad, avisos, aj, coords] = await Promise.all([
    q(sb.from('fechas').select('*').order('dia')),
    q(sb.from('solicitudes').select('*')),
    q(sb.from('alumnos').select('*').order('nombre')),
    q(sb.from('autorizaciones').select('alumno_id,estado,apoderado_nombre,firmada_en,vence,firma')),
    q(sb.from('registro_apoderados').select('*').order('alumno_email')),
    q(sb.from('codigos_invitacion').select('*')),
    q(sb.from('actividad').select('*').order('id', { ascending:false }).limit(30)),
    q(sb.from('avisos').select('*').order('creado')),
    q(sb.from('ajustes').select('*').eq('id', 1).maybeSingle()),
    q(sb.from('coordinadores').select('*')),
  ]);
  ST.c = { fechas, sols, alumnos, auts, registro, codigos, actividad, avisos, aj:aj || {}, coords };
  ST.c.al = Object.fromEntries(alumnos.map(a => [a.id, a]));
  ST.c.reg = Object.fromEntries(registro.map(r => [r.alumno_email.toLowerCase(), r]));
}
const C_ = () => ST.c;
const fechaC = id => C_().fechas.find(f => f.id === id);
const solsDe = (id, est, col) => C_().sols.filter(s => s.fecha_id === id && (!est || s.estado === est) && (!col || (C_().al[s.alumno_id] || {}).colegio === col));
const vigC = id => { const a = C_().auts.find(x => x.alumno_id === id); return a && a.estado === 'vigente' && fromIso(a.vence) >= hoy(); };
const histC = id => histDe(C_().sols.filter(s => s.alumno_id === id), C_().fechas, C_().aj);
const puntaje = s => { const h = histC(s.alumno_id); return (h.baja ? 1000 : 0) + h.veces * 10 + new Date(s.creada).getTime() / 1e13; };
function sugeridos(f){
  const out = new Set();
  ['vd','vm'].forEach(col => { const lib = f['cupos_' + col] - solsDe(f.id, 'aceptado', col).length; if (lib <= 0) return;
    solsDe(f.id, 'solicitud', col).sort((a, b) => puntaje(a) - puntaje(b)).slice(0, lib).forEach(s => out.add(s.id)); });
  return out;
}

      <div class="statrow" style="margin-bottom:12px"><div class="stat"><span class="big">${sal}/${ac.length}</span><small>salieron</small></div><div class="stat"><span class="big">${reg}/${sal}</span><small>volvieron</small></div><div class="stat" style="${faltan.length ? 'background:var(--redsoft)' : ''}"><span class="big">${faltan.length}</span><small>faltan por volver</small></div></div>
      <div class="scanbox" id="scanbox"><video id="vid" playsinline muted></video><canvas id="scv" hidden></canvas>
        <div class="scanidle">${ic('qr')}<p>Escanea el pase de cada alumno al ${ST.porteria === 'salida' ? 'salir' : 'volver'}</p><button class="btn pri" data-act="camara">${ic('scan','s')}Abrir cámara</button></div></div>
      ${faltan.length && ST.porteria === 'regreso' ? `<div class="aviso cancel" style="margin:12px 0"><b>Faltan por volver</b><p>${faltan.map(s => esc((C_().al[s.alumno_id] || {}).nombre)).join(', ')}</p></div>` : ''}
      <div class="sec" style="margin-top:16px"><h2>Marcar a mano</h2></div>
      <div class="rows">${(ST.porteria === 'regreso' ? ac.filter(s => s.salida) : ac).map(s => persona(f, s, 'port')).join('') || '<div class="empty">Nadie por marcar.</div>'}</div>`;
  }
  return `<button class="back" data-act="volver">${ic('back','s')}Todas las fechas</button>
    <div class="card pad20"><div class="dhead"><div class="dt"><b>${d.getDate()}</b><small>${MESC[d.getMonth()]}</small></div>
      <div style="min-width:0;flex:1"><h2>${cap(dLarga(f.dia))}</h2><p class="meta">${ic('clock','s')}${t5(f.inicio)} a ${t5(f.fin)}</p><p class="meta">${ic('map','s')}${esc(f.lugar)}</p><div style="margin-top:8px">${estadoTag(f)}</div></div></div>
      ${f.estado === 'cancelada' ? `<div class="aviso cancel" style="margin-top:12px"><b>Motivo</b><p>${esc(f.motivo || '')}</p></div>` : ''}
      <div class="btns" style="margin-top:14px"><button class="btn sm soft" data-act="editar">${ic('edit','s')}Editar</button>
        ${past ? '' : f.estado === 'cancelada' ? `<button class="btn sm soft" data-act="reactivar">Reactivar</button>` : `<button class="btn sm soft" data-act="cerrar">${f.estado === 'cerrada' ? 'Reabrir' : 'Cerrar solicitudes'}</button><button class="btn sm soft" data-act="avisoh">${ic('send','s')}Aviso</button><button class="btn sm danger" data-act="cancelar">${ic('ban','s')}No hay café</button>`}
        <button class="btn sm danger" data-act="eliminar">${ic('trash','s')}Eliminar</button><button class="btn sm soft" data-act="copiar">${ic('copy','s')}Copiar lista</button></div></div>
    ${f.estado === 'cancelada' ? '' : `<nav class="dtabs">${[['solicitudes',`Solicitudes${nS ? ` <span class="n">${nS}</span>` : ''}`],['aceptados',`Aceptados ${nA}`],['porteria','Portería']].map(([k,l]) => `<button class="${dt === k ? 'on' : ''}" data-dt2="${k}">${l}</button>`).join('')}</nav>${panel}`}`;
}
function hojaFechaC(f){
  const aj = C_().aj, n = !f; f = f || { dia:iso(hoy()), inicio:aj.inicio, fin:aj.fin, lugar:aj.lugar, cupos_vd:aj.cupos_vd, cupos_vm:aj.cupos_vm, nota:'' };
  openSheet(n ? 'Nueva fecha' : 'Editar fecha', `<label class="field"><span>Día</span><input type="date" id="fF" value="${f.dia}"></label>
    <div class="grid2" style="margin-top:12px"><label class="field"><span>Inicio (24 h)</span><input id="fI" inputmode="numeric" maxlength="5" value="${t5(f.inicio)}"></label><label class="field"><span>Término (24 h)</span><input id="fT" inputmode="numeric" maxlength="5" value="${t5(f.fin)}"></label></div>
    <label class="field" style="margin-top:12px"><span>Punto de encuentro</span><input id="fL" value="${esc(f.lugar)}"></label>
    <div class="grid2" style="margin-top:12px"><label class="field"><span>Cupos ${nomCol('vd')}</span><input type="number" min="0" id="fCvd" value="${f.cupos_vd}"></label><label class="field"><span>Cupos ${nomCol('vm')}</span><input type="number" min="0" id="fCvm" value="${f.cupos_vm}"></label></div>
    <label class="field" style="margin-top:12px"><span>Nota (opcional)</span><textarea id="fN" maxlength="200">${esc(f.nota || '')}</textarea></label>
    <div class="err" id="ferr"></div><button class="btn pri block" data-guardarf="${n ? '' : f.id}">${n ? 'Crear fecha' : 'Guardar'}</button>`);
}

/* ---------- cámara ---------- */
let cam = null;
async function abrirCamara(){
  if (!navigator.mediaDevices || typeof jsQR !== 'function') return toast('Este navegador no permite escanear. Marca a mano');
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    const vid = $('#vid'), cv = $('#scv'), g = cv.getContext('2d', { willReadFrequently:true });
    vid.srcObject = st; await vid.play(); $('#scanbox').classList.add('live'); cam = { st, raf:0, last:'' };
    const loop = () => { if (!cam) return;
      if (vid.readyState >= 2) { cv.width = vid.videoWidth; cv.height = vid.videoHeight; g.drawImage(vid, 0, 0); const r = jsQR(g.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
        if (r && r.data && r.data !== cam.last) { cam.last = r.data; marcarQR(r.data.replace(/^CS1:/, ''), true); setTimeout(() => { if (cam) cam.last = ''; }, 2500); } }
      cam.raf = requestAnimationFrame(loop); };
    loop();
  } catch (e) { toast('No se pudo abrir la cámara. Revisa los permisos'); }
}
function cerrarCamara(){ if (!cam) return; cancelAnimationFrame(cam.raf); cam.st.getTracks().forEach(t => t.stop()); cam = null; }
async function marcarQR(qr, conCam){
  const b = $('#scanbox');
  try { const r = await rpc('marcar_qr', { p_qr:qr, p_tipo:ST.porteria });
    if (b) { b.classList.remove('ok','bad'); void b.offsetWidth; b.classList.add('ok'); } if (navigator.vibrate) navigator.vibrate(40);
    await cargarCoord(); render(); toast(`${r.nombre} · ${r.tipo} ${r.hora}`); if (conCam) abrirCamara(); }
  catch (e) { if (b) { b.classList.remove('ok','bad'); void b.offsetWidth; b.classList.add('bad'); } if (navigator.vibrate) navigator.vibrate([60,40,60]); toast(msgError(e)); }
}

/* =========================================================
   HOJAS, RENDER Y EVENTOS
   ========================================================= */
let sheet = null;
function openSheet(title, html){
  closeSheet(true);
  const bd = document.createElement('div'); bd.className = 'bd';
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  el.innerHTML = `<div class="hd"><h2>${title}</h2><button class="x" data-close aria-label="Cerrar">${ic('x')}</button></div><div class="bdy">${html}</div>`;
  document.body.append(bd, el); bd.onclick = () => closeSheet();
  requestAnimationFrame(() => requestAnimationFrame(() => { bd.classList.add('on'); el.classList.add('on'); }));
  sheet = { el, bd }; document.body.style.overflow = 'hidden';
}
function closeSheet(now){
  if (!sheet) return; const { el, bd } = sheet; sheet = null; document.body.style.overflow = '';
  if (now) { el.remove(); bd.remove(); return; }
  el.classList.remove('on'); bd.classList.remove('on'); setTimeout(() => { el.remove(); bd.remove(); }, 400);
}
function syncSegs(){ $$('[data-seg]').forEach(s => { const on = s.querySelector('button.on'), th = s.querySelector('i'); if (!on || !th) return; th.style.width = on.offsetWidth + 'px'; th.style.transform = `translateX(${on.offsetLeft - 4}px)`; }); }
function render(){
  cerrarCamara();
  let h;
  if (!ST.rol) h = vIngreso();
  else if (ST.rol === 'coord') h = vCoord();
  else if (ST.rol === 'apoderado') h = vApoderado();
  else h = vAlumno();
  $('#app').innerHTML = h;
  if (!ST.rol) bindIngreso();
  if (ST.rol === 'alumno' && !ST.alumno) bindPerfil();
  requestAnimationFrame(syncSegs);
}
const conTry = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(msgError(e)); } };

document.addEventListener('click', conTry(async e => {
  const t = e.target; let el;
  if (t.closest('[data-close]')) return closeSheet();
  if ((el = t.closest('[data-modo]'))) { setModo(el.dataset.modo); L.paso = 'correo'; return render(); }
  if ((el = t.closest('[data-copy]'))) { navigator.clipboard && navigator.clipboard.writeText(el.dataset.copy).then(() => toast('Link copiado')); return; }

  /* alumno */
  if ((el = t.closest('[data-tab]'))) { ST.tab = el.dataset.tab; render(); return window.scrollTo(0, 0); }
  if ((el = t.closest('[data-fecha]'))) return hojaFecha(el.dataset.fecha);
  if ((el = t.closest('[data-sol]'))) { el.disabled = true; const f = ST.fechas.find(x => x.id === el.dataset.sol); await rpc('pedir_unirme', { p_fecha:f.id }); await cargarAlumno(); closeSheet(); render(); return taza(f); }
  if ((el = t.closest('[data-baja]'))) {
    const s = miSol(el.dataset.baja), lim = t5(ST.ajustes.baja_sin_falta) || '12:00', f = ST.fechas.find(x => x.id === el.dataset.baja);
    if (s.estado === 'aceptado' && f.dia === iso(hoy()) && hhmm(new Date()) >= lim && !confirm(`Ya pasaron las ${lim}. Si te bajas ahora, cuenta como falta. ¿Bajarte igual?`)) return;
    const r = await rpc('retirarme', { p_fecha:f.id }); await cargarAlumno(); closeSheet(); render(); return toast(r === 'falta' ? 'Avisamos a la coordinación. Cuenta como falta' : 'Listo');
  }

  /* apoderado */
  if ((el = t.closest('[data-firmar]'))) return hojaFirma(el.dataset.firmar);
  if ((el = t.closest('[data-avisar]'))) { await rpc('apoderado_avisos', { p_alumno:el.dataset.avisar, p_avisar:el.dataset.v === '1' }); ST.apo = await rpc('apoderado_mis_alumnos'); return render(); }
  if ((el = t.closest('[data-revocar]'))) { if (!confirm('¿Revocar la autorización? Se cancelan sus solicitudes futuras.')) return; await rpc('apoderado_revocar', { p_alumno:el.dataset.revocar }); ST.apo = await rpc('apoderado_mis_alumnos'); render(); return toast('Autorización revocada'); }

  if ((el = t.closest('[data-act]'))) {
    const a = el.dataset.act, f = ST.cfecha && ST.c && fechaC(ST.cfecha);
    switch (a) {
      case 'volverinicio': L.paso = 'inicio'; return render();
      case 'salir': return salir();
      case 'pedir': { const m = await rpc('pedir_autorizacion'); await cargarAlumno(); render(); return compartir(m); }
      case 'compartir': return compartir();
      case 'recargar': return recargar('Actualizado');
      case 'nueva': return hojaFechaC(null);
      case 'editar': return hojaFechaC(f);
      case 'mes': {
        const d = hoy(); d.setMonth(d.getMonth() + 1, 1); const m = d.getMonth(), aj = C_().aj, rows = [];
        while (d.getMonth() === m) { if (d.getDay() === 3 && !C_().fechas.some(x => x.dia === iso(d))) rows.push({ dia:iso(d), inicio:aj.inicio, fin:aj.fin, lugar:aj.lugar, cupos_vd:aj.cupos_vd, cupos_vm:aj.cupos_vm }); d.setDate(d.getDate() + 1); }
        if (rows.length) { await q(sb.from('fechas').insert(rows)); await logC(`Se agregaron ${rows.length} fechas de ${MES[m]}`); }
        return recargar(rows.length ? `Agregamos ${rows.length} miércoles de ${MES[m]}` : `Los miércoles de ${MES[m]} ya estaban creados`);
      }
      case 'volver': ST.cfecha = null; return render();
      case 'cerrar': await q(sb.from('fechas').update({ estado:f.estado === 'cerrada' ? 'abierta' : 'cerrada' }).eq('id', f.id)); return recargar();
      case 'reactivar': await q(sb.from('fechas').update({ estado:'abierta', motivo:null }).eq('id', f.id)); return recargar('Fecha reactivada');
      case 'cancelar': return openSheet('No hay café esta fecha', `<label class="field"><span>Motivo (lo verán los alumnos)</span><textarea id="cM" maxlength="160"></textarea></label><div class="err" id="cerr2"></div><button class="btn danger block" data-cancelok="${f.id}">${ic('ban','s')}Cancelar la salida</button>`);
      case 'avisoh': return openSheet('Aviso a los inscritos', `<label class="field"><span>Mensaje</span><textarea id="avt" maxlength="300"></textarea></label><button class="btn pri block" style="margin-top:12px" data-act="aviso">${ic('send','s')}Publicar aviso</button>`);
      case 'aviso': { const v = $('#avt').value.trim(); if (!v) return; await q(sb.from('avisos').insert({ fecha_id:f.id, texto:v, autor:'Coordinación' })); closeSheet(); return recargar('Aviso publicado'); }
      case 'eliminar': { const n = solsDe(f.id).length; if (!confirm(n ? `${n} personas pidieron unirse. ¿Eliminarla igual? Si solo no se hará, mejor usa "No hay café".` : '¿Eliminar esta fecha?')) return;
        await q(sb.from('fechas').delete().eq('id', f.id)); await logC(`Se eliminó el ${dLarga(f.dia)}`); ST.cfecha = null; return recargar('Fecha eliminada'); }
      case 'copiar': { const rows = [['Nombre','Colegio','Curso','Estado','Salida','Regreso','Apoderado','Celular']].concat(solsDe(f.id).map(s => { const u = C_().al[s.alumno_id] || {}, r = C_().reg[(u.email || '').toLowerCase()] || {}; return [u.nombre, nomCol(u.colegio), u.curso, s.estado, s.salida ? hhmm(s.salida) : '', s.regreso ? hhmm(s.regreso) : '', r.nombre || '', r.celular || '']; }));
        return navigator.clipboard.writeText(rows.map(r => r.join('\t')).join('\n')).then(() => toast('Lista copiada para Excel')); }
      case 'aceptsug': { const ids = [...sugeridos(f)]; if (!ids.length) return; await q(sb.from('solicitudes').update({ estado:'aceptado' }).in('id', ids)); await logC(`Se aceptaron ${ids.length} solicitudes para el ${dLarga(f.dia)}`); return recargar(`Aceptaste a ${ids.length} personas`); }
      case 'camara': return abrirCamara();
      case 'guardaraj': { const i1 = hm($('#dIni').value), f1 = hm($('#dFin').value); if (!i1 || !f1 || f1 <= i1) return toast('Revisa el horario, en formato 24 horas');
        await q(sb.from('ajustes').update({ inicio:i1, fin:f1, lugar:$('#dLug').value.trim(), cupos_vd:+$('#dCvd').value, cupos_vm:+$('#dCvm').value }).eq('id', 1)); return recargar('Guardado'); }
      case 'addreg': return openSheet('Agregar apoderado', `<label class="field"><span>Correo del alumno</span><input id="rA" type="email"></label><label class="field"><span>Nombre del apoderado</span><input id="rN"></label>
        <div class="grid2" style="margin-top:12px"><label class="field"><span>RUT</span><input id="rR"></label><label class="field"><span>Celular</span><input id="rC" type="tel"></label></div>
        <label class="field" style="margin-top:12px"><span>Correo del apoderado</span><input id="rM" type="email"></label><div class="err" id="rerr"></div><button class="btn pri block" data-act="guardarreg">Agregar</button>`);
      case 'guardarreg': { const err = m => $('#rerr').textContent = m, al = $('#rA').value.trim().toLowerCase(), n = $('#rN').value.trim(), r = $('#rR').value, m = $('#rM').value.trim().toLowerCase();
        if (!/@/.test(al) || !/@/.test(m)) return err('Revisa los correos'); if (n.split(/\s+/).length < 2) return err('Nombre y apellido'); if (!rutOk(r)) return err('RUT no válido');
        await q(sb.from('registro_apoderados').upsert({ alumno_email:al, nombre:n, rut:fmtRut(r), correo:m, celular:$('#rC').value.trim() })); closeSheet(); return recargar('Apoderado agregado'); }
      case 'importar': return openSheet('Pegar desde Excel', `<p class="muted" style="margin-bottom:12px">Columnas en este orden: correo del alumno, nombre del apoderado, RUT, correo del apoderado, celular.</p><label class="field"><span>Datos</span><textarea id="rI" style="min-height:160px;font-size:14px"></textarea></label><div class="err" id="rerr"></div><button class="btn pri block" data-act="importok">Importar</button>`);
      case 'importok': { const rows = $('#rI').value.split(/\r?\n/).map(l => l.split(/\t|;/).map(x => x.trim())).filter(l => l.length >= 4 && /@/.test(l[0]) && rutOk(l[2]) && /@/.test(l[3])).map(([al, n, r, m, c]) => ({ alumno_email:al.toLowerCase(), nombre:n, rut:fmtRut(r), correo:m.toLowerCase(), celular:c || '' }));
        if (!rows.length) return $('#rerr').textContent = 'No encontramos filas válidas. Revisa el orden de las columnas';
        await q(sb.from('registro_apoderados').upsert(rows)); closeSheet(); return recargar(`Importamos ${rows.length} apoderados`); }
    }
  }

  /* coordinación */
  if ((el = t.closest('[data-ctab]'))) { ST.ctab = el.dataset.ctab; ST.cfecha = null; ST.q = ''; render(); return window.scrollTo(0, 0); }
  if ((el = t.closest('[data-open]'))) { ST.cfecha = el.dataset.open; ST.ctab = 'fechas'; const f = fechaC(ST.cfecha); ST.dtab = el.dataset.dt || (esPasada(f) ? 'aceptados' : solsDe(f.id, 'solicitud').length ? 'solicitudes' : 'aceptados'); render(); return window.scrollTo(0, 0); }
  if ((el = t.closest('[data-dt2]'))) { ST.dtab = el.dataset.dt2; return render(); }
  if ((el = t.closest('[data-pmode]'))) { ST.porteria = el.dataset.pmode; return render(); }
  if ((el = t.closest('[data-psub]'))) { ST.psub = el.dataset.psub; ST.q = ''; return render(); }
  if ((el = t.closest('[data-acept]'))) { await q(sb.from('solicitudes').update({ estado:'aceptado' }).eq('id', el.dataset.acept)); return recargar('Aceptado'); }
  if ((el = t.closest('[data-rech]'))) { await q(sb.from('solicitudes').update({ estado:'rechazado' }).eq('id', el.dataset.rech)); return recargar('Le avisamos que esta vez no quedó'); }
  if ((el = t.closest('[data-quitar]'))) { await q(sb.from('solicitudes').update({ estado:'solicitud' }).eq('id', el.dataset.quitar)); return recargar('Volvió a solicitudes'); }
  if ((el = t.closest('[data-perd]'))) { await q(sb.from('solicitudes').update({ perdonada:el.dataset.v === '1' }).eq('id', el.dataset.perd)); return recargar(el.dataset.v === '1' ? 'Falta perdonada' : 'La falta vuelve a contar'); }
  if ((el = t.closest('[data-marca]'))) { const s = C_().sols.find(x => x.qr === el.dataset.marca); if (s && s[ST.porteria]) return toast('Ya estaba marcado'); return marcarQR(el.dataset.marca, false); }
  if ((el = t.closest('[data-delreg]'))) { if (!confirm('¿Quitar a este apoderado del registro?')) return; await q(sb.from('registro_apoderados').delete().eq('alumno_email', el.dataset.delreg)); return recargar('Quitado'); }
  if ((el = t.closest('[data-cod]'))) { await q(sb.from('codigos_invitacion').update({ activo:el.dataset.v === '1' }).eq('codigo', el.dataset.cod)); return recargar(); }
  if ((el = t.closest('[data-newcod]'))) { const code = `CAFE-${el.dataset.newcod.toUpperCase()}-${rid(4).toUpperCase()}`; await q(sb.from('codigos_invitacion').insert({ codigo:code, colegio:el.dataset.newcod })); return recargar(`Código ${code} creado`); }
  if ((el = t.closest('[data-guardarf]'))) {
    const id = el.dataset.guardarf, err = m => $('#ferr').textContent = m, dia = $('#fF').value, i2 = hm($('#fI').value), fin = hm($('#fT').value), lug = $('#fL').value.trim();
    if (!dia) return err('Elige el día'); if (!i2 || !fin || fin <= i2) return err('Revisa el horario en formato 24 horas, por ejemplo 15:30'); if (!lug) return err('Escribe el punto de encuentro');
    const row = { dia, inicio:i2, fin, lugar:lug, cupos_vd:+$('#fCvd').value, cupos_vm:+$('#fCvm').value, nota:$('#fN').value.trim() || null };
    try { if (id) await q(sb.from('fechas').update(row).eq('id', id)); else { const n = await q(sb.from('fechas').insert(row).select().single()); ST.cfecha = n.id; ST.dtab = 'solicitudes'; await logC(`Se creó la salida del ${dLarga(dia)}`); } }
    catch (x) { return err(/duplicate|unique/i.test(x.message) ? 'Ya existe una salida ese día' : msgError(x)); }
    closeSheet(); return recargar(id ? 'Cambios guardados' : 'Fecha creada');
  }
  if ((el = t.closest('[data-cancelok]'))) { const m = $('#cM').value.trim(); if (!m) return $('#cerr2').textContent = 'Escribe el motivo';
    await q(sb.from('fechas').update({ estado:'cancelada', motivo:m }).eq('id', el.dataset.cancelok)); await q(sb.from('avisos').insert({ fecha_id:el.dataset.cancelok, texto:'Esta vez no hay café: ' + m, autor:'Coordinación' })); closeSheet(); return recargar('Salida cancelada'); }
}));
document.addEventListener('input', e => { if (e.target.id === 'aq') { ST.q = e.target.value; const p = e.target.selectionStart; render(); const x = $('#aq'); if (x) { x.focus(); x.setSelectionRange(p, p); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && ST.rol && await sesionVencida()) { Object.assign(ST, { rol:null, alumno:null, c:null }); L.paso = 'inicio'; render(); } });
addEventListener('resize', syncSegs);

/* ---------- arranque ---------- */
(async () => {
  if (location.hash === '#coord') setModo('coord');
  if (location.hash === '#apoderado') setModo('apoderado');
  if (await sesionVencida()) return render();
  const { data:{ session } } = await sb.auth.getSession();
  if (session) await cargarRol(); else { L.paso = (location.hash === '#coord' || location.hash === '#apoderado') ? 'correo' : 'inicio'; render(); }
})();
</script>
